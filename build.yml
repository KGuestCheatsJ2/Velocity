name: Build velocity-cs2 DLL

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install LLVM 19
        run: |
          choco install llvm --version=19.1.7 -y --no-progress
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Development DLL
        working-directory: cs2/velocity-cs2
        run: |
          msbuild velocity-cs2.vcxproj `
            /p:Configuration=Development `
            /p:Platform=x64 `
            /p:LLVMToolsVersion=19 `
            /p:CLToolExe=clang-cl.exe `
            /p:CLToolPath="C:\Program Files\LLVM\bin" `
            /p:LinkToolExe=lld-link.exe `
            /p:LinkToolPath="C:\Program Files\LLVM\bin" `
            /m /v:minimal

      - name: Find output DLL
        id: find_dll
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse -Filter "velocity-cs2-dev.dll" | Select-Object -First 1
          if (-not $dll) {
            $dll = Get-ChildItem -Recurse -Filter "*.dll" | Where-Object { $_.Name -notlike "*system*" } | Select-Object -First 1
          }
          echo "dll_path=$($dll.FullName)" >> $env:GITHUB_OUTPUT
          echo "Found: $($dll.FullName)"

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: velocity-cs2-dev
          path: ${{ steps.find_dll.outputs.dll_path }}
          retention-days: 7
