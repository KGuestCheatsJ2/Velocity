name: Build velocity-cs2 DLL

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Find LLVM version and path
        id: llvm
        shell: pwsh
        run: |
          $ver = (clang-cl --version 2>&1 | Select-String "clang version (\d+)").Matches[0].Groups[1].Value
          echo "llvm_ver=$ver" >> $env:GITHUB_OUTPUT
          $bin = Split-Path (Get-Command clang-cl).Source
          echo "llvm_bin=$bin" >> $env:GITHUB_OUTPUT
          echo "LLVM version: $ver, bin: $bin"

      - name: Patch LLVMToolsVersion in vcxproj
        shell: pwsh
        run: |
          $ver = "${{ steps.llvm.outputs.llvm_ver }}"
          $file = "cs2/velocity-cs2/velocity-cs2.vcxproj"
          (Get-Content $file) -replace '<LLVMToolsVersion>19</LLVMToolsVersion>', "<LLVMToolsVersion>$ver</LLVMToolsVersion>" | Set-Content $file
          echo "Patched LLVMToolsVersion to $ver"

      - name: Build Development DLL
        working-directory: cs2/velocity-cs2
        shell: pwsh
        run: |
          $llvmbin = "${{ steps.llvm.outputs.llvm_bin }}"
          msbuild velocity-cs2.vcxproj `
            /p:Configuration=Development `
            /p:Platform=x64 `
            /p:CLToolExe=clang-cl.exe `
            /p:CLToolPath="$llvmbin" `
            /p:LinkToolExe=lld-link.exe `
            /p:LinkToolPath="$llvmbin" `
            /m /v:minimal

      - name: Find output DLL
        id: find_dll
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse -Filter "velocity-cs2-dev.dll" | Select-Object -First 1
          if (-not $dll) {
            $dll = Get-ChildItem -Recurse -Filter "*.dll" | Where-Object { $_.DirectoryName -notlike "*system32*" } | Select-Object -First 1
          }
          echo "dll_path=$($dll.FullName)" >> $env:GITHUB_OUTPUT
          echo "Found: $($dll.FullName)"

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: velocity-cs2-dev
          path: ${{ steps.find_dll.outputs.dll_path }}
          retention-days: 7
