name: Build velocity-cs2 DLL

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install LLVM into Visual Studio
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          echo "VS Path: $vsPath"
          # Get installed LLVM version
          $llvmVer = (clang-cl --version 2>&1 | Select-String "clang version (\d+\.\d+\.\d+)").Matches[0].Groups[1].Value
          $llvmMajor = $llvmVer.Split('.')[0]
          echo "LLVM version: $llvmVer, major: $llvmMajor"
          # Create symlink so MSBuild finds it
          $src = "C:\Program Files\LLVM"
          $dst = "$vsPath\VC\Tools\llvm\x64"
          if (-not (Test-Path $dst)) { New-Item -ItemType Directory -Path $dst -Force }
          # Copy clang libs into VS LLVM folder
          $clangLibSrc = "C:\Program Files\LLVM\lib\clang"
          $clangLibDst = "$vsPath\VC\Tools\llvm\x64\lib\clang"
          if (Test-Path $clangLibSrc) {
            Copy-Item -Path $clangLibSrc -Destination $clangLibDst -Recurse -Force
          }
          # Patch vcxproj to use detected version
          $file = "cs2/velocity-cs2/velocity-cs2.vcxproj"
          (Get-Content $file) -replace '<LLVMToolsVersion>19</LLVMToolsVersion>', "<LLVMToolsVersion>$llvmMajor</LLVMToolsVersion>" | Set-Content $file
          echo "Patched vcxproj LLVMToolsVersion to $llvmMajor"
          # Also set toolset path
          $bin = Split-Path (Get-Command clang-cl).Source
          echo "LLVM_BIN=$bin" >> $env:GITHUB_ENV
          echo "LLVM_MAJOR=$llvmMajor" >> $env:GITHUB_ENV

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Development DLL
        working-directory: cs2/velocity-cs2
        shell: pwsh
        run: |
          msbuild velocity-cs2.vcxproj `
            /p:Configuration=Development `
            /p:Platform=x64 `
            /p:CLToolExe=clang-cl.exe `
            /p:CLToolPath="$env:LLVM_BIN" `
            /p:LinkToolExe=lld-link.exe `
            /p:LinkToolPath="$env:LLVM_BIN" `
            /p:LLVMInstallDir="C:\Program Files\LLVM" `
            /m /v:minimal

      - name: Find output DLL
        id: find_dll
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse -Filter "velocity-cs2-dev.dll" | Select-Object -First 1
          if (-not $dll) {
            $dll = Get-ChildItem -Recurse -Filter "*.dll" | Where-Object { $_.DirectoryName -notlike "*system32*" } | Select-Object -First 1
          }
          echo "dll_path=$($dll.FullName)" >> $env:GITHUB_OUTPUT
          echo "Found: $($dll.FullName)"

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: velocity-cs2-dev
          path: ${{ steps.find_dll.outputs.dll_path }}
          retention-days: 7
