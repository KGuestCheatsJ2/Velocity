name: Build velocity-cs2 DLL

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Find LLVM path
        id: llvm
        shell: pwsh
        run: |
          $clangcl = Get-Command clang-cl -ErrorAction SilentlyContinue
          if ($clangcl) {
            $llvmbin = Split-Path $clangcl.Source
            echo "llvm_bin=$llvmbin" >> $env:GITHUB_OUTPUT
            echo "Found clang-cl at: $llvmbin"
          } else {
            $paths = @("C:\Program Files\LLVM\bin", "C:\Program Files (x86)\LLVM\bin")
            foreach ($p in $paths) {
              if (Test-Path "$p\clang-cl.exe") {
                echo "llvm_bin=$p" >> $env:GITHUB_OUTPUT
                echo "Found at: $p"
                break
              }
            }
          }
          clang-cl --version

      - name: Build Development DLL
        working-directory: cs2/velocity-cs2
        shell: pwsh
        run: |
          $llvmbin = "${{ steps.llvm.outputs.llvm_bin }}"
          msbuild velocity-cs2.vcxproj `
            /p:Configuration=Development `
            /p:Platform=x64 `
            /p:CLToolExe=clang-cl.exe `
            /p:CLToolPath="$llvmbin" `
            /p:LinkToolExe=lld-link.exe `
            /p:LinkToolPath="$llvmbin" `
            /m /v:minimal

      - name: Find output DLL
        id: find_dll
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse -Filter "velocity-cs2-dev.dll" | Select-Object -First 1
          if (-not $dll) {
            $dll = Get-ChildItem -Recurse -Filter "*.dll" | Where-Object { $_.DirectoryName -notlike "*system32*" } | Select-Object -First 1
          }
          echo "dll_path=$($dll.FullName)" >> $env:GITHUB_OUTPUT
          echo "Found: $($dll.FullName)"

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: velocity-cs2-dev
          path: ${{ steps.find_dll.outputs.dll_path }}
          retention-days: 7
